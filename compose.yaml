services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run python scripts/init_env.py first}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RECALLGUARD_AGENT_KEY: ${RECALLGUARD_AGENT_KEY:?Run python scripts/init_env.py first}
      RECALLGUARD_REVIEWER_KEY: ${RECALLGUARD_REVIEWER_KEY:?Run python scripts/init_env.py first}
      RECALLGUARD_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  neo4j-data:
