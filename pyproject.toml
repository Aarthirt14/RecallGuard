[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recallguard"
version = "0.5.0"
description = "Origin-bound memory security for AI agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "uvicorn==0.54.0",
  "neo4j==6.3.1",
  "langgraph==1.2.12",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.9"]
semantic = ["fastembed==0.8.1"]

[project.scripts]
recallguard-eval = "recallguard.evaluation.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recallguard = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js", "dashboard/*.svg"]
"recallguard.evaluation" = ["cases.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires a running Neo4j database",
  "model: requires the optional embedding model and RECALLGUARD_TEST_MODEL=1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
