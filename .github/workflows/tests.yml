name: Security core
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-only-recallguard-password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget --quiet --spider http://localhost:7474"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
        env:
          NEO4J_TEST_URI: bolt://localhost:7687
          NEO4J_TEST_PASSWORD: ci-only-recallguard-password
      - run: python examples/poisoning.py
      - run: python examples/procurement.py
  embedding-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,semantic]'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/recallguard-models
          key: minilm-fastembed-0.8.1-v1
      - run: python -m pytest -q -m model
        env:
          RECALLGUARD_TEST_MODEL: "1"
          RECALLGUARD_EMBEDDING_CACHE: /home/runner/.cache/recallguard-models
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -e '.[dev]'
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm test
